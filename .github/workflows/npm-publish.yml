name: Publish to npm

# The npm half of the release scheme. JSR is published inline by release.yml;
# npm is published HERE, for the release that release.yml has just created.
#
# CUT RELEASES ONLY (#223): the registries carry `v<version>` cuts and
# nothing else. A `pre-<shorthash>` tag is REFUSED by the version step
# below rather than ignored, which also gives the `release: published`
# backstop teeth — a hand-made GitHub prerelease can start this workflow,
# but it cannot publish anything.
#
# How this is reached: release.yml DISPATCHES it explicitly (its last step,
# on cut releases only). The `release: published` trigger below is a
# backstop for a release created by hand — it cannot serve the automated
# path, because GitHub does not start workflow runs from events raised with
# GITHUB_TOKEN, and `workflow_dispatch` is the documented exception to that
# rule.
#
# Why not a step inside release.yml, next to the JSR publish: npm's trusted
# publishing (OIDC) validates the CALLING workflow's filename, and release.yml
# is reached two different ways — `workflow_call` from ci.yml on every green
# main (the automatic prerelease path) and `workflow_dispatch` directly (a cut
# release). npm allows exactly ONE trusted publisher per package, so an inline
# step could only ever authorize one of those two paths. A dispatched run of
# this file is its own entry point, so npm always sees the same workflow_ref.
#
# Consequences of that choice, both fine: npm lands just after the GitHub
# release rather than just before it, and a failed npm publish can be re-run on
# its own without re-running the release.
#
# Trusted publisher configuration (one-time, per package, on npmjs.com →
# Settings → Trusted Publisher): organization `polymorph-components`,
# repository `polyengine`, workflow filename `npm-publish.yml`, no environment.
# There is no npm token anywhere in this repository, by design.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish to npm (a cut tag, e.g. v0.1.0).
        required: true
        type: string

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

jobs:
  npm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: resolve the release tag
        id: rel
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.rel.outputs.tag }}
          submodules: true

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.5"
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm >= 11.5.1, which Node 24 ships.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: compute the version
        id: ver
        # Mirrors release.yml's scheme exactly, derived from the tag so the two
        # cannot drift: a cut release tags `v<version>` and publishes at
        # exactly that version. `pre-<shorthash>` tags are refused, not
        # skipped: prereleases are GitHub releases carrying artifacts and are
        # published to NO registry (#223), so reaching this workflow with one
        # means something dispatched or triggered it in error, and a clear
        # failure beats a surprise publish. This VERSION is the build stamp
        # for the lockstep four (runtime, translator, wasi, ct-runner) only —
        # build.ts passes it as `--version` and it does NOT affect
        # @polyengine/protocol, which always emits at its own manifest
        # version (A10).
        run: |
          TAG='${{ steps.rel.outputs.tag }}'
          case "$TAG" in
            v*)
              VERSION="${TAG#v}"
              ;;
            pre-*)
              echo "tag '$TAG' is a prerelease: prereleases are not published to npm or JSR (policy as of #223) — only cut releases (v<version>) are" >&2
              exit 1
              ;;
            *)
              echo "tag '$TAG' is not a cut tag (v<version>)" >&2
              exit 1
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "lockstep stamp: $VERSION"

      - name: fetch the released translator shim
        # @polyengine/translator carries the wasm as a packaged asset. Taking
        # it from the release rather than rebuilding it makes the npm package
        # ship the byte-identical artifact the release advertises, and skips a
        # Rust toolchain entirely.
        run: |
          gh release download '${{ steps.rel.outputs.tag }}' \
            --repo "$GITHUB_REPOSITORY" \
            --pattern polyengine-translator-shim.wasm \
            --output translator/translator_shim.wasm
          sha256sum translator/translator_shim.wasm
        env:
          GH_TOKEN: ${{ github.token }}

      - name: build the npm packages
        # The build script directly, not `just npm-build`: that recipe depends
        # on `shim`, which would rebuild from source the asset just downloaded.
        run: deno run -A tools/npm-build/build.ts --version '${{ steps.ver.outputs.version }}'

      - name: publish
        # Dependency order — protocol first: it is not part of the lockstep
        # (A10), so it publishes once per manifest bump, at its own version,
        # and is skipped as already-published at every cut after that (npm
        # parity with release.yml's JSR step). Publishing it before its
        # dependents guarantees the version they reference (via a caret
        # dependency — see build.ts) already exists on the registry the first
        # time it is needed. An already-published version is skipped rather
        # than failed — a re-run after a partial failure completes the set
        # instead of stranding it — but only when the published tarball's
        # `gitHead` equals the sha being published: the job is checked out at
        # the release tag, so a legitimate re-run matches. Anything else means
        # the version name is occupied by a different tree (an unverifiable
        # occupant — missing `gitHead` — counts): npm versions are immutable,
        # so that name can never carry this content, and publishing the
        # dependents would ship a graph whose caret range resolves to a
        # foreign protocol. Hard failure, before any dependent publishes.
        #
        # Every version reaching this loop is a bare cut version (the step
        # above refuses anything else), so `latest` is the only dist-tag in
        # play; the `pre` tag belongs to the retired prerelease-publishing
        # flow and stays frozen wherever it last pointed.
        #
        # Provenance attestations are generated automatically for trusted
        # publishing from a public repository; no --provenance flag needed.
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          for p in protocol runtime translator wasi ct-runner; do
            name="@polyengine/$p"
            V=$(jq -r '.version' "./npm/$p/package.json")
            if npm view "$name@$V" version >/dev/null 2>&1; then
              published_head=$(npm view "$name@$V" gitHead 2>/dev/null || true)
              if [ "$published_head" = "$HEAD_SHA" ]; then
                echo "$name@$V already published from $HEAD_SHA — skipping"
                continue
              fi
              echo "FATAL: $name@$V exists on npm but was published from" \
                   "'${published_head:-<no gitHead>}', not $HEAD_SHA." >&2
              echo "That version name is burned: npm versions are immutable." \
                   "Bump $name's manifest version and re-cut." >&2
              exit 1
            fi
            echo "publishing $name@$V (dist-tag latest)"
            npm publish --tag latest --workspaces=false ./npm/"$p"
          done
