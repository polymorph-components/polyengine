[package]
name = "bindgen"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "bindgen"
path = "src/main.rs"

[lib]
name = "bindgen"
path = "src/lib.rs"

[dependencies]
# wit-parser is pinned to match crates/translator-shim's wasmparser pin
# exactly (docs/architecture.md §9): both ride the wasm-tools workspace's
# lockstep release train, so a single version number covers both crates.
# Bump this pin together with translator-shim's wasmtime-environ pin.
wit-parser = { version = "=0.252.0", features = ["serde"] }
anyhow = "1"
sha2 = { version = "0.10", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

# build.rs derives the default import base's runtime version from
# runtime/deno.json (issue #201). serde_json is already a normal dependency,
# so no new third-party code enters the tree.
[build-dependencies]
serde_json = "1"

[dev-dependencies]
