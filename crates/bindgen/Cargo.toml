[package]
name = "bindgen"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "bindgen"
path = "src/main.rs"

[lib]
name = "bindgen"
path = "src/lib.rs"

[dependencies]
# Version pinned in the root workspace table, alongside translator-shim's wasmtime-environ pin (docs/architecture.md §9).
wit-parser = { workspace = true }
anyhow = "1"
sha2 = { version = "0.10", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

# build.rs derives the default import base's runtime version from
# runtime/deno.json (issue #201). serde_json is already a normal dependency,
# so no new third-party code enters the tree.
[build-dependencies]
serde_json = "1"

[dev-dependencies]
